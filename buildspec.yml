version: 0.2
env:
  parameter-store:
    APP_TOKEN: /myapp/dev/token
phases:
  install:
    runtime-versions: 
      nodejs: 20
  pre_build:
    commands:
      - echo "Token length is ${#APP_TOKEN}"   # In độ dài, KHÔNG in giá trị thực
  build:
    commands:
      - npm ci
      - npm run build
artifacts:
  files: 
    - '**/*'
  base-directory: dist
cache:
  paths: 
    - 'node_modules/**/*'